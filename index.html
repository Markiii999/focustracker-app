<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Tracker</title>
<meta name="theme-color" content="#1D6A57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Focus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root {
  color-scheme: light dark;
  --bg: #F2F6F4;
  --surface: #FFFFFF;
  --ink: #15221E;
  --muted: #566862;
  --line: #D6E0DC;
  --accent: #1D6A57;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEEE8;
  --warn: #A84F08;
  --warn-soft: #FBEADB;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1614;
    --surface: #17221F;
    --ink: #E7F0ED;
    --muted: #9BB0A9;
    --line: #2A3B36;
    --accent: #4FC3A1;
    --accent-ink: #08201A;
    --accent-soft: #19322B;
    --warn: #F0A260;
    --warn-soft: #3A2B1C;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
}
.shell { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; flex-direction: column; gap: 4px; }
h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
h2 { font-size: 1.1rem; font-weight: 600; margin: 0; }
.status { font-size: 0.8125rem; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 20px; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status.ok .dot { background: var(--accent); }
.status.warn { color: var(--warn); }
.status.warn .dot { background: var(--warn); }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 12px 14px; font-size: 0.875rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daynav .label { text-align: center; min-width: 0; flex: 1; }
.daynav .label strong { display: block; font-size: 1.25rem; font-weight: 600; }
.daynav .label span { color: var(--muted); font-size: 0.875rem; }
.iconbtn, .btn {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; min-height: 44px; min-width: 44px; padding: 0 14px; cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { min-height: 36px; font-size: 0.875rem; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.summary { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.summary .count { font-weight: 600; font-size: 1.05rem; }
.tag { font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.stack { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.done { border-color: var(--accent); }
.cardhead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.cardhead .meta { min-width: 0; }
.cardhead p { margin: 2px 0 0; color: var(--muted); font-size: 0.875rem; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; color: var(--accent-ink); font-size: 0.9rem; }
.card.done .check { background: var(--accent); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 0.9375rem; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 999px; min-height: 48px; padding: 0 16px; cursor: pointer; text-align: left;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip.extra { border-style: dashed; }
.progressline { color: var(--muted); font-size: 0.8125rem; }
textarea, input[type="number"] {
  font: inherit; width: 100%; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
}
textarea { min-height: 84px; resize: vertical; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 0.875rem; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daycell { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; min-width: 0; }
.daycell .bubble { width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 0.95rem; color: var(--accent-ink); }
.daycell.full .bubble { background: var(--accent); border-color: var(--accent); }
.daycell.part .bubble { border-color: var(--accent); color: var(--accent); }
.daycell.future { opacity: 0.45; }
.daycell.today .bubble { box-shadow: 0 0 0 3px var(--accent-soft); }
.statuschip { font-size: 0.75rem; font-weight: 600; border-radius: 8px; padding: 3px 8px; white-space: nowrap; }
.statuschip.met { background: var(--accent-soft); color: var(--accent); }
.statuschip.ontrack { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.statuschip.behind, .statuschip.missed { background: var(--warn-soft); color: var(--warn); }
.wkdots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.wkdot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.wkdot.met { background: var(--accent); border-color: var(--accent); }
.wkdot.missed { background: var(--warn); border-color: var(--warn); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.note { color: var(--muted); font-size: 0.875rem; margin: 0; }
.rowline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center; gap: 8px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.tabs a { flex: 1; max-width: 300px; text-align: center; text-decoration: none; color: var(--muted); font-weight: 600; padding: 12px 0; border-radius: 12px; min-height: 44px; }
.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>Focus Tracker</h1>
    <div id="status" class="status" role="status" aria-live="polite"><span class="dot"></span><span id="statustext">Loading</span></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Views">
  <a href="#today" id="tab-today">Today</a>
  <a href="#week" id="tab-week">Week</a>
</nav>

<script>
(function () {
  'use strict';

  var START = '2026-11-23';
  var EXAM_WEEK = '2026-12-07';
  var BACKUP_NAG_DAYS = 3;
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var DAYS_SHORT = ['M','T','W','T','F','S','S'];

  var INDS = [
    { id: 'move', title: 'Push-ups and squats', target: 3, exam: 2,
      line: 'Both done on at least 3 days a week',
      chips: [['push', 'Push-ups'], ['squat', 'Squats']], need: ['push', 'squat'] },
    { id: 'skin', title: 'Skin routine', target: 6, exam: 5,
      line: 'Morning and night, on 6 of 7 days',
      chips: [['skinAm', 'Morning'], ['skinPm', 'Night']], need: ['skinAm', 'skinPm'] },
    { id: 'sleep', title: 'Steady sleep', target: 5, exam: 5,
      line: 'In bed by 10 pm and up within 30 minutes of 6 am, on 5 of 7 nights',
      chips: [['sleepBed', 'Last night: in bed by 10 pm'], ['sleepWake', 'This morning: up within 30 min of 6 am']], need: ['sleepBed', 'sleepWake'] },
    { id: 'brush', title: 'Brushing', target: 6, exam: 5,
      line: 'Morning and night, on 6 of 7 days',
      chips: [['brushAm', 'Morning'], ['brushPm', 'Night'], ['scraper', 'Tongue scraper (extra)']], need: ['brushAm', 'brushPm'] },
    { id: 'tongue', title: 'Tongue posture', target: 5, exam: 4,
      line: 'Kept it up most of the day, on 5 of 7 days',
      chips: [['tongue', 'Kept it up most of the day']], need: ['tongue'] }
  ];

  /* Two copies of the data are kept under two keys, so a write that is cut short
     (a dead battery, for example) can never wipe both. */
  var KEY_A = 'focus-tracker-offline-a';
  var KEY_B = 'focus-tracker-offline-b';
  var state = { days: {}, weeks: {}, months: {}, meta: {} };
  var view = 'today';
  var selDate = todayStr();
  var selWeek = weekStart(todayStr());
  var fallbackText = '';
  var restoreText = '';
  var restoreMsg = '';
  var dirty = false;
  var statusKind = 'loading';
  var lastSaved = 0;
  var storageOk = true;

  /* ---------- dates ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function todayStr() { return ymd(new Date()); }
  function weekStart(s) { var d = parse(s); var k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return ymd(d); }
  function weekDates(ws) { var a = []; for (var i = 0; i < 7; i++) a.push(addDays(ws, i)); return a; }
  function fmtShort(s) { var d = parse(s); return MONTHS[d.getMonth()] + ' ' + d.getDate(); }
  function weekdayName(s) { return DAYS[parse(s).getDay()]; }
  function monthKey(s) { return s.slice(0, 7); }
  function esc(t) {
    return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

  /* ---------- storage ---------- */
  function readKey(k) {
    try {
      var raw = localStorage.getItem(k);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (o && typeof o === 'object' && o.days && o.weeks && o.months) return o;
    } catch (e) { /* unreadable copy */ }
    return null;
  }
  function newer(a, b) {
    if (!a) return b;
    if (!b) return a;
    return (a.meta && a.meta.saved || 0) >= (b.meta && b.meta.saved || 0) ? a : b;
  }
  function loadLocal() {
    var best = newer(readKey(KEY_A), readKey(KEY_B));
    if (best) {
      state.days = best.days;
      state.weeks = best.weeks;
      state.months = best.months;
      state.meta = best.meta || {};
    }
  }
  function saveLocal() {
    state.meta.saved = Date.now();
    var text = JSON.stringify(state);
    try {
      localStorage.setItem(KEY_A, text);
      localStorage.setItem(KEY_B, text);
      storageOk = true;
      lastSaved = Date.now();
      setStatus('saved');
    } catch (e) {
      storageOk = false;
      setStatus('fail');
    }
  }

  /* ---------- status and banner ---------- */
  function setStatus(kind) {
    statusKind = kind;
    var el = document.getElementById('status');
    var tx = document.getElementById('statustext');
    if (!el || !tx) return;
    var cls = 'status', text = '';
    if (kind === 'saved') {
      cls += ' ok';
      var t = lastSaved ? new Date(lastSaved) : new Date();
      text = 'Saved on this phone, ' + pad(t.getHours()) + ':' + pad(t.getMinutes());
    } else if (kind === 'fail') {
      cls += ' warn'; text = 'Could not save on this phone. Copy a backup now.';
    } else if (kind === 'ready') {
      text = 'Ready. Works offline.';
    } else {
      text = 'Loading';
    }
    el.className = cls;
    tx.textContent = text;
  }
  function hasData() {
    return Object.keys(state.days).length + Object.keys(state.weeks).length + Object.keys(state.months).length > 0;
  }
  function updateBanner() {
    var b = document.getElementById('banner');
    if (!b) return;
    var msg = '';
    if (!storageOk) {
      msg = 'This phone is not letting the app save. Copy a backup now and send it to Claude.';
    } else if (hasData()) {
      var last = state.meta.lastBackup || 0;
      var age = last ? daysBetween(last, Date.now()) : null;
      if (last === 0 || age >= BACKUP_NAG_DAYS) {
        msg = last === 0 ? 'No backup yet. Copy one from the Week tab and send it to Claude.' : 'Last backup was ' + age + ' days ago. Copy a new one from the Week tab.';
      }
    }
    if (msg) { b.innerHTML = '<span>' + esc(msg) + '</span><button class="btn small" data-act="goweek">Back up</button>'; b.hidden = false; }
    else { b.hidden = true; }
  }

  /* ---------- writes ---------- */
  function setField(kind, id, field, value, noRender) {
    var cur = Object.assign({}, state[kind][id] || {});
    cur[field] = value;
    cur.updated = Date.now();
    state[kind][id] = cur;
    saveLocal();
    updateBanner();
    if (!noRender) render();
  }

  /* ---------- logic ---------- */
  function chipsDone(d, ind) {
    if (!d) return false;
    return ind.need.every(function (k) { return !!d[k]; });
  }
  function chipCount(d, ind) {
    if (!d) return 0;
    return ind.need.filter(function (k) { return !!d[k]; }).length;
  }
  function targetFor(ind, ws) { return ws === EXAM_WEEK ? ind.exam : ind.target; }
  function weekCount(ind, ws) {
    return weekDates(ws).filter(function (d) { return chipsDone(state.days[d], ind); }).length;
  }
  function weekStatus(ind, ws) {
    var t = targetFor(ind, ws), c = weekCount(ind, ws), today = todayStr();
    var dates = weekDates(ws);
    var remaining = dates.filter(function (d) { return d >= today; }).length;
    var ended = dates[6] < today;
    if (c >= t) return 'met';
    if (ended) return 'missed';
    if (c + remaining >= t) return 'ontrack';
    return 'behind';
  }
  var STATUS_LABEL = { met: 'Met', ontrack: 'On track', behind: 'Out of reach', missed: 'Missed' };

  function completedWeeks() {
    var list = [];
    var ws = weekStart(START), cur = weekStart(todayStr()), today = todayStr();
    while (ws <= cur) {
      if (addDays(ws, 6) < today) list.push(ws);
      ws = addDays(ws, 7);
    }
    return list;
  }

  /* ---------- views ---------- */
  function todayHTML() {
    var d = state.days[selDate] || {};
    var ws = weekStart(selDate);
    var doneCount = INDS.filter(function (i) { return chipsDone(d, i); }).length;
    var isToday = selDate === todayStr();
    var html = '';
    html += '<div class="daynav">'
      + '<button class="iconbtn" data-act="day-prev" aria-label="Previous day">&#8592;</button>'
      + '<div class="label"><strong>' + esc(weekdayName(selDate)) + '</strong><span>' + esc(fmtShort(selDate)) + (isToday ? ', today' : '') + '</span></div>'
      + '<button class="iconbtn" data-act="day-next" aria-label="Next day">&#8594;</button>'
      + '</div>';
    html += '<div class="summary"><span class="count">' + doneCount + ' of 5 done</span>';
    if (!isToday) html += '<button class="btn small" data-act="day-today">Back to today</button>';
    html += '</div>';
    if (ws === EXAM_WEEK) html += '<div class="summary"><span class="tag warn">Exam week: reduced targets</span></div>';
    if (selDate < START) html += '<p class="note">This is before the plan starts on ' + esc(fmtShort(START)) + '. Entries still save.</p>';
    html += '<div class="stack">';
    INDS.forEach(function (ind) {
      var done = chipsDone(d, ind);
      var c = weekCount(ind, ws), t = targetFor(ind, ws);
      html += '<section class="card' + (done ? ' done' : '') + '">'
        + '<div class="cardhead"><div class="meta"><h2>' + esc(ind.title) + '</h2><p>' + esc(ind.line) + '</p></div>'
        + '<span class="check" aria-hidden="true">' + (done ? '&#10003;' : '') + '</span></div>'
        + '<div class="chips">';
      ind.chips.forEach(function (ch) {
        var on = !!d[ch[0]];
        var extra = ind.need.indexOf(ch[0]) === -1;
        html += '<button class="chip' + (extra ? ' extra' : '') + '" aria-pressed="' + on + '" data-act="chip" data-k="' + ch[0] + '">' + esc(ch[1]) + '</button>';
      });
      html += '</div><div class="progressline">This week: ' + c + ' of ' + t + ' days</div></section>';
    });
    html += '</div>';
    html += '<section class="card" style="margin-top:12px"><label class="field" for="note">Note for the day (optional)'
      + '<textarea id="note" data-field="note" data-kind="days" data-id="' + esc(selDate) + '" placeholder="Anything worth remembering">' + esc(d.note || '') + '</textarea></label></section>';
    return html;
  }

  function weekHTML() {
    var ws = selWeek;
    var dates = weekDates(ws);
    var today = todayStr();
    var isExam = ws === EXAM_WEEK;
    var wk = state.weeks[ws] || {};
    var mk = monthKey(ws);
    var mo = state.months[mk] || {};
    var html = '';
    html += '<div class="daynav">'
      + '<button class="iconbtn" data-act="wk-prev" aria-label="Previous week">&#8592;</button>'
      + '<div class="label"><strong>' + esc(fmtShort(ws)) + ' to ' + esc(fmtShort(addDays(ws, 6))) + '</strong><span>' + (ws === weekStart(today) ? 'This week' : 'Week') + '</span></div>'
      + '<button class="iconbtn" data-act="wk-next" aria-label="Next week">&#8594;</button>'
      + '</div>';
    if (ws !== weekStart(today)) html += '<div class="summary"><span></span><button class="btn small" data-act="wk-this">Back to this week</button></div>';
    if (isExam) html += '<div class="summary"><span class="tag warn">Exam week: reduced targets</span></div>';
    html += '<div class="stack">';
    INDS.forEach(function (ind) {
      var st = weekStatus(ind, ws);
      var c = weekCount(ind, ws), t = targetFor(ind, ws);
      html += '<section class="card"><div class="cardhead"><div class="meta"><h2>' + esc(ind.title) + '</h2><p>' + c + ' of ' + t + ' days</p></div>'
        + '<span class="statuschip ' + st + '">' + STATUS_LABEL[st] + '</span></div><div class="weekdays">';
      dates.forEach(function (ds, i) {
        var dd = state.days[ds];
        var full = chipsDone(dd, ind);
        var part = !full && chipCount(dd, ind) > 0;
        var cls = 'daycell' + (full ? ' full' : '') + (part ? ' part' : '') + (ds > today ? ' future' : '') + (ds === today ? ' today' : '');
        html += '<button class="' + cls + '" data-act="goday" data-d="' + ds + '" aria-label="' + esc(weekdayName(ds) + ' ' + fmtShort(ds) + (full ? ', done' : part ? ', partly done' : ', not done')) + '">'
          + '<span class="bubble">' + (full ? '&#10003;' : part ? '&#183;' : '') + '</span><span>' + DAYS_SHORT[i] + '</span></button>';
      });
      html += '</div></section>';
    });
    html += '</div>';

    var weeks = completedWeeks().slice(-5);
    html += '<section class="card" style="margin-top:12px"><h2>Moving on to maintenance</h2>'
      + '<p class="note">A habit is reached when its target is met in 4 of the last 5 weeks.</p>';
    if (weeks.length === 0) {
      html += '<p class="note">The first full week ends on ' + esc(fmtShort(addDays(weekStart(START), 6))) + '. Results appear here after it.</p>';
    }
    INDS.forEach(function (ind) {
      var results = weeks.map(function (w) { return weekStatus(ind, w) === 'met' ? 'met' : 'missed'; });
      var metN = results.filter(function (r) { return r === 'met'; }).length;
      var ready = metN >= 4;
      html += '<div class="rowline"><span>' + esc(ind.title) + '</span><span class="wkdots">';
      results.forEach(function (r) { html += '<span class="wkdot ' + r + '"></span>'; });
      html += '<span class="statuschip ' + (ready ? 'met' : 'ontrack') + '">' + (weeks.length ? (ready ? 'Ready for maintenance' : metN + ' of ' + weeks.length) : 'Not yet') + '</span></span></div>';
    });
    html += '</section>';

    html += '<section class="card" style="margin-top:12px"><h2>Sunday review</h2><div class="toggles">';
    [['review', 'Review done'], ['water', 'Water, 2 L or more'], ['supps', 'Supplements taken']].forEach(function (x) {
      html += '<button class="chip" aria-pressed="' + !!wk[x[0]] + '" data-act="wtoggle" data-k="' + x[0] + '">' + x[1] + '</button>';
    });
    html += '</div><label class="field" for="felt">How the week felt'
      + '<textarea id="felt" data-field="felt" data-kind="weeks" data-id="' + esc(ws) + '" placeholder="One or two sentences">' + esc(wk.felt || '') + '</textarea></label></section>';

    html += '<section class="card" style="margin-top:12px"><h2>Savings, ' + esc(MONTHS[parse(ws).getMonth()]) + '</h2><div class="row2">'
      + '<label class="field" for="saved">Saved ($)<input id="saved" type="number" inputmode="decimal" data-field="saved" data-kind="months" data-id="' + esc(mk) + '" value="' + esc(mo.saved || '') + '"></label>'
      + '<label class="field" for="pct">Share of income (%)<input id="pct" type="number" inputmode="decimal" data-field="pct" data-kind="months" data-id="' + esc(mk) + '" value="' + esc(mo.pct || '') + '"></label>'
      + '</div></section>';

    var lb = state.meta.lastBackup;
    html += '<section class="card" style="margin-top:12px"><h2>Backup and share</h2>'
      + '<p class="note">Your entries are stored on this phone and work offline. Copy a backup at least once a week and paste it to Claude, who keeps a copy in your files.</p>'
      + '<p class="note">Last backup: ' + (lb ? esc(fmtShort(ymd(new Date(lb)))) : 'none yet') + '</p>'
      + '<div class="toggles"><button class="btn primary" data-act="copy-backup">Copy full backup</button>'
      + '<button class="btn" data-act="copy-report">Copy weekly report</button></div>';
    if (fallbackText) {
      html += '<p class="note">Copying was blocked. Select the text below and copy it.</p><textarea id="fb" readonly>' + esc(fallbackText) + '</textarea>';
    }
    html += '</section>';

    html += '<section class="card" style="margin-top:12px"><h2>Restore from a backup</h2>'
      + '<p class="note">Only needed on a new phone or after losing data. Paste a backup here. Newer entries are kept.</p>'
      + '<textarea id="restore" placeholder="Paste backup here">' + esc(restoreText) + '</textarea>'
      + '<div class="toggles"><button class="btn" data-act="restore">Restore</button></div>'
      + (restoreMsg ? '<p class="note">' + esc(restoreMsg) + '</p>' : '')
      + '</section>';
    return html;
  }

  function render() {
    var main = document.getElementById('main');
    if (!main) return;
    main.innerHTML = view === 'week' ? weekHTML() : todayHTML();
    var tt = document.getElementById('tab-today'), tw = document.getElementById('tab-week');
    if (view === 'week') { tw.setAttribute('aria-current', 'page'); tt.removeAttribute('aria-current'); }
    else { tt.setAttribute('aria-current', 'page'); tw.removeAttribute('aria-current'); }
    if (fallbackText) {
      var fb = document.getElementById('fb');
      if (fb) { try { fb.focus(); fb.select(); } catch (e) { /* ignore */ } }
    }
  }
  document.addEventListener('focusout', function () {
    if (dirty) { dirty = false; setTimeout(render, 0); }
  });

  /* ---------- reports and backup ---------- */
  function reportText() {
    var ws = selWeek, dates = weekDates(ws);
    var lines = [];
    lines.push('Focus week: ' + fmtShort(ws) + ' to ' + fmtShort(addDays(ws, 6)) + (ws === EXAM_WEEK ? ' (exam week, reduced targets)' : ''));
    INDS.forEach(function (ind) {
      lines.push('- ' + ind.title + ': ' + weekCount(ind, ws) + ' of ' + targetFor(ind, ws) + ' days (' + STATUS_LABEL[weekStatus(ind, ws)] + ')');
    });
    var wk = state.weeks[ws] || {};
    lines.push('Sunday review: ' + (wk.review ? 'done' : 'not done') + '; water: ' + (wk.water ? 'yes' : 'no') + '; supplements: ' + (wk.supps ? 'yes' : 'no'));
    var mo = state.months[monthKey(ws)] || {};
    if (mo.saved || mo.pct) lines.push('Savings this month: ' + (mo.saved ? '$' + mo.saved : 'n/a') + (mo.pct ? ', ' + mo.pct + '% of income' : ''));
    if (wk.felt) lines.push('How the week felt: ' + wk.felt);
    var notes = dates.filter(function (d) { return state.days[d] && state.days[d].note; });
    if (notes.length) {
      lines.push('Notes:');
      notes.forEach(function (d) { lines.push('  ' + weekdayName(d).slice(0, 3) + ' ' + fmtShort(d) + ': ' + state.days[d].note); });
    }
    return lines.join('\n');
  }
  function backupText() {
    return 'FOCUS-TRACKER-BACKUP\n' + JSON.stringify({ days: state.days, weeks: state.weeks, months: state.months }, null, 1);
  }
  async function copyText(text, isBackup) {
    try {
      await navigator.clipboard.writeText(text);
      fallbackText = '';
      if (isBackup) { state.meta.lastBackup = Date.now(); saveLocal(); updateBanner(); }
      var tx = document.getElementById('statustext');
      if (tx) { tx.textContent = 'Copied'; setTimeout(function () { setStatus(statusKind); }, 1500); }
      if (isBackup) render();
    } catch (e) {
      fallbackText = text;
      if (isBackup) { state.meta.lastBackup = Date.now(); saveLocal(); updateBanner(); }
      render();
    }
  }
  function restore() {
    var ta = document.getElementById('restore');
    var raw = ta ? ta.value : restoreText;
    restoreText = raw;
    var i = raw.indexOf('{');
    if (i < 0) { restoreMsg = 'That does not look like a backup.'; render(); return; }
    var data;
    try { data = JSON.parse(raw.slice(i)); } catch (e) { restoreMsg = 'The backup could not be read. Paste the whole text.'; render(); return; }
    if (!data || typeof data !== 'object' || !data.days || !data.weeks || !data.months) { restoreMsg = 'That does not look like a backup.'; render(); return; }
    var n = 0;
    ['days', 'weeks', 'months'].forEach(function (kind) {
      Object.keys(data[kind]).forEach(function (id) {
        var incoming = data[kind][id];
        var have = state[kind][id];
        if (incoming && typeof incoming === 'object' && (!have || (incoming.updated || 0) > (have.updated || 0))) {
          state[kind][id] = incoming; n++;
        }
      });
    });
    saveLocal();
    restoreText = '';
    restoreMsg = 'Restored ' + n + ' entries.';
    updateBanner();
    render();
  }

  /* ---------- events ---------- */
  var main = document.getElementById('main');
  main.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'chip') {
      var k = b.getAttribute('data-k');
      var cur = state.days[selDate] || {};
      setField('days', selDate, k, !cur[k]);
    } else if (act === 'wtoggle') {
      var k2 = b.getAttribute('data-k');
      var w = state.weeks[selWeek] || {};
      setField('weeks', selWeek, k2, !w[k2]);
    } else if (act === 'day-prev') { selDate = addDays(selDate, -1); render(); }
    else if (act === 'day-next') { selDate = addDays(selDate, 1); render(); }
    else if (act === 'day-today') { selDate = todayStr(); render(); }
    else if (act === 'wk-prev') { selWeek = addDays(selWeek, -7); fallbackText = ''; render(); }
    else if (act === 'wk-next') { selWeek = addDays(selWeek, 7); fallbackText = ''; render(); }
    else if (act === 'wk-this') { selWeek = weekStart(todayStr()); fallbackText = ''; render(); }
    else if (act === 'goday') { selDate = b.getAttribute('data-d'); location.hash = 'today'; if (view === 'today') render(); }
    else if (act === 'copy-report') { copyText(reportText(), false); }
    else if (act === 'copy-backup') { copyText(backupText(), true); }
    else if (act === 'restore') { restore(); }
  });
  document.getElementById('banner').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act="goweek"]');
    if (b) { location.hash = 'week'; }
  });
  main.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.getAttribute) return;
    if (t.id === 'restore') { restoreText = t.value; return; }
    var f = t.getAttribute('data-field');
    if (!f) return;
    dirty = true;
    setField(t.getAttribute('data-kind'), t.getAttribute('data-id'), f, t.value, true);
  });
  function route() {
    view = location.hash === '#week' ? 'week' : 'today';
    if (view === 'week') selWeek = weekStart(selDate);
    fallbackText = '';
    restoreMsg = '';
    render();
  }
  window.addEventListener('hashchange', route);

  /* ---------- start ---------- */
  loadLocal();
  route();
  updateBanner();
  setStatus(hasData() ? 'saved' : 'ready');
  if (hasData()) { lastSaved = state.meta.saved || Date.now(); setStatus('saved'); }
  try {
    if (navigator.storage && navigator.storage.persist) { navigator.storage.persist(); }
  } catch (e) { /* ignore */ }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* the app still works online */ });
    });
  }
})();
</script>
</body>
</html>
